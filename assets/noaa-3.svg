<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-labelledby="title desc">
  <title id="title">The HTML inside a NOAA news article</title>
  <desc id="desc">A simplified article with class node-teaser contains a title div with a headline link, a time tag with a publication date, and a focus-areas div with category links. Intermediate wrapper tags and unrelated content are omitted.</desc>
  <rect width="1080" height="660" rx="16" fill="#f4f7fb"/>
  <text x="36" y="48" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#073b68">One NOAA article: the HTML we want</text>
  <text x="36" y="78" font-family="Arial, sans-serif" font-size="16" fill="#4c6074">Simplified from the listing. Wrapper tags, image links, and part of the long URL are omitted.</text>
  <rect x="30" y="101" width="1020" height="519" rx="10" fill="white" stroke="#b6c7d7" stroke-width="2"/>
  <rect x="45" y="117" width="989" height="37" rx="6" fill="#dceaf7"/>
  <g font-family="monospace" font-size="17" fill="#172b3e">
    <text x="57" y="142">&lt;article class="... node-teaser"&gt;</text>
    <text x="80" y="196">&lt;div class="title"&gt;</text>
    <text x="105" y="229">&lt;a href="/news/weekend-noreaster-..."&gt;</text>
    <text x="129" y="261">Weekend nor’easter likely to bring damaging winds, coastal flooding</text>
    <text x="105" y="292">&lt;/a&gt;</text>
    <text x="80" y="323">&lt;/div&gt;</text>
    <text x="80" y="377">&lt;time datetime="2026-09-25T12:00:00Z"&gt;September 25, 2026&lt;/time&gt;</text>
    <text x="80" y="431">&lt;div class="tags focus-areas"&gt;</text>
    <text x="105" y="463">&lt;a href="/weather"&gt;Weather&lt;/a&gt;</text>
    <text x="80" y="494">&lt;/div&gt;</text>
    <text x="57" y="589">&lt;/article&gt;</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700">
    <text x="725" y="141" fill="#073b68">Container for one article</text>
    <text x="700" y="321" fill="#176c45">Title text + relative URL</text>
    <text x="822" y="400" fill="#945d0b">Publication date</text>
    <text x="700" y="493" fill="#6736a3">Categories = “Focus areas”</text>
  </g>
  <line x1="64" y1="177" x2="64" y2="334" stroke="#176c45" stroke-width="4"/>
  <line x1="64" y1="353" x2="64" y2="389" stroke="#945d0b" stroke-width="4"/>
  <line x1="64" y1="406" x2="64" y2="505" stroke="#6736a3" stroke-width="4"/>
  <text x="80" y="544" font-family="Arial, sans-serif" font-size="16" fill="#4c6074">Each block has its own title, date, and categories. Search inside that block!</text>
</svg>
