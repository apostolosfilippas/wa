    "nltk>=3.9.0",
    "textstat>=0.7.0",
    # Workflow
    "temporalio>=1.16.0",
    # Database
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.16.0",
    # Utilities
    "httpx>=0.28.0",
    "python-dotenv>=1.2.0",
    "rich>=14.0.0",
    "typer>=0.20.0",
    # Jupyter
    "ipykernel>=6.0.0",
    "jupyter>=1.0.0",
    "nbconvert>=7.0.0",
    # Dev tools
    "pre-commit>=4.0.0",
    "black>=24.0.0",
]
