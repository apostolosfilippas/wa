[project]
name = "wa"
version = "0.1.0"
description = "Web Analytics - Python for Web Data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core AI/LLM
    "anthropic>=0.75.0",
    "openai>=2.0.0",
    "tiktoken>=0.12.0",
    "litellm>=1.0.0",
    "mistralai>=1.0.0",
    "google-genai>=1.0.0",
    "cohere>=5.0.0",
    "groq>=0.37.0",
    "llama-index>=0.12.0",
    # Pydantic ecosystem
    "pydantic>=2.12.0",
    "pydantic-ai-slim>=0.8.0",
    # Web framework
    "fastapi>=0.123.0",
    "uvicorn>=0.38.0",
    # Web scraping
    "selenium>=4.0.0",
    "beautifulsoup4>=4.0.0",
    "requests>=2.32.0",
    # Data processing
    "numpy>=2.0.0",
    "pandas>=2.3.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.0.0",
